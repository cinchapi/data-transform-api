version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:8.0.322
    environment:
      GRADLE_OPTS: "-Djenkins=true"
      TERM: dumb
      CONTAINER_BUILD: "true"
    steps:
      - checkout:
          path: ~/$CIRCLE_PROJECT_REPONAME
      - run:
          name: Build and Upload
          command: |
            cd ~/$CIRCLE_PROJECT_REPONAME
            ./gradlew clean build publish --refresh-dependencies
      - run:
          name: Save test results
          command: |
            cd ~/$CIRCLE_PROJECT_REPONAME
            mkdir -p ~/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/junit/ \;
          when: always
      - store_test_results:
          path: ~/junit
      - run:
          name: Save artifacts
          command: |
            cd ~/$CIRCLE_PROJECT_REPONAME
            mkdir -p ~/artifacts/
            find . -type f -regex ".*/build/libs/.*jar" -exec cp {} ~/artifacts/ \;
      - store_artifacts:
          path: ~/artifacts

workflows:
  build:
    jobs:
      - build:
          context: cloudsmith-creds
